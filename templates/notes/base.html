<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Technical Journal{% endblock %}</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10151d;color:#eef0f4;font:17px/1.7 system-ui,sans-serif}.shell{max-width:850px;margin:auto;padding:28px 24px}header{border-bottom:1px solid #354152;display:flex;justify-content:space-between;gap:20px}a{color:#67e5dc;text-decoration:none}a:hover{text-decoration:underline}h1{font-size:clamp(30px,6vw,48px);line-height:1.2}h2{font-size:25px}.muted,time{color:#b6c0cd}article{padding:28px 0;border-bottom:1px solid #354152}form{display:flex;gap:12px;flex-wrap:wrap}label{display:block}input,select,button{font:inherit;padding:9px 12px;background:#172130;color:#eef0f4;border:1px solid #51657a;max-width:100%}button{cursor:pointer}input{min-width:0}nav{display:flex;gap:20px;margin-top:30px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.skip{position:absolute;top:-100px}.skip:focus{top:0;background:#10151d}footer{color:#b6c0cd;font-size:13px}a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #67e5dc;outline-offset:4px}
</style></head><body><a class="skip" href="#main">Vai al contenuto</a><header class="shell"><a href="{% url 'index' %}">Technical Journal /</a><a href="{% url 'feed' %}">RSS ↗</a></header><main class="shell" id="main">{% block content %}{% endblock %}</main><footer class="shell">Appunti tecnici, analisi e decisioni documentate.</footer></body></html>
